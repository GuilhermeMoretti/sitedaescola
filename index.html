<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b3d91">
  <meta name="description" content="Site oficial da E.E. Presidente Arthur Bernardes da Silva - Cerquilho, SP. Educação, conhecimento, respeito e futuro.">
  <title>E.E. Pres. Arthur Bernardes</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --azul: #0b3d91;
      --azul-escuro: #062456;
      --azul-suave: #eff6ff;
      --laranja: #f97316;
      --verde: #10b981;
      --fundo: #f8fafc;
      --branco: #ffffff;
      --texto: #0f172a;
      --texto-sec: #475569;
      --borda: #e2e8f0;
      --sombra: 0 12px 32px -8px rgba(15, 23, 42, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: var(--texto);
      background: var(--fundo);
    }

    body {
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1180px, 92%);
      margin: 0 auto;
    }

    /* ================= NAVBAR FLUTUANTE ================= */
    .topo {
      position: sticky;
      top: 12px;
      z-index: 100;
      margin: 12px auto 0;
      width: min(1180px, 92%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid var(--borda);
      border-radius: 18px;
      box-shadow: var(--sombra);
    }

    .navegacao {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      padding: 0 22px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .simbolo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--azul), var(--azul-escuro));
      color: #fff;
      font-weight: 800;
      font-size: 1.25rem;
      display: grid;
      place-items: center;
    }

    .logo-texto {
      display: flex;
      flex-direction: column;
    }

    .logo-texto strong {
      font-size: 0.98rem;
      color: var(--azul-escuro);
      font-weight: 800;
    }

    .logo-texto small {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--texto-sec);
      font-weight: 700;
    }

    .menu a {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--texto-sec);
      padding: 10px 18px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .menu a:hover {
      color: var(--azul);
    }

    .menu a.ativo {
      background: var(--azul);
      color: #fff;
    }

    .menu a.ativo:hover {
      background: var(--azul-escuro);
      color: #fff;
    }

    .menu-botao {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .menu-botao span {
      width: 24px;
      height: 2.5px;
      background: var(--texto);
      border-radius: 2px;
    }

    /* ================= HERO EDITORIAL ================= */
    .hero {
      padding: 56px 0 64px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 48px;
      align-items: center;
    }

    .etiqueta-clara {
      display: inline-block;
      background: var(--azul-suave);
      color: var(--azul);
      border: 1px solid #bfdbfe;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 4.2vw, 3.4rem);
      line-height: 1.1;
      font-weight: 800;
      color: var(--azul-escuro);
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: var(--laranja);
    }

    .hero p {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--texto-sec);
      margin-bottom: 28px;
      max-width: 520px;
    }

    .hero-botoes {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn-primario {
      background: var(--azul);
      color: #fff;
      padding: 14px 26px;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(11, 61, 145, 0.2);
      transition: 0.2s;
    }

    .btn-primario:hover {
      background: var(--azul-escuro);
      transform: translateY(-2px);
    }

    .btn-secundario {
      background: var(--branco);
      color: var(--texto);
      padding: 14px 26px;
      border-radius: 12px;
      font-weight: 700;
      border: 1px solid var(--borda);
      transition: 0.2s;
    }

    .btn-secundario:hover {
      border-color: var(--azul);
      color: var(--azul);
    }

    .moldura-hero {
      position: relative;
    }

    .moldura-hero img {
      width: 100%;
      height: 390px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.18);
    }

    .badge-flutuante {
      position: absolute;
      bottom: 18px;
      left: 18px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--borda);
      box-shadow: var(--sombra);
    }

    .badge-flutuante strong {
      display: block;
      color: var(--laranja);
      font-size: 1.25rem;
      font-weight: 800;
    }

    .badge-flutuante span {
      font-size: 0.8rem;
      color: var(--texto-sec);
      font-weight: 600;
    }

    /* ================= ATALHOS BENTO ================= */
    .atalhos {
      margin-bottom: 24px;
    }

    .atalhos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .atalho-card {
      background: var(--branco);
      padding: 20px;
      border-radius: 18px;
      border: 1px solid var(--borda);
      display: flex;
      align-items: center;
      gap: 14px;
      transition: 0.2s;
    }

    .atalho-card:hover {
      border-color: var(--azul);
      transform: translateY(-3px);
      box-shadow: var(--sombra);
    }

    .atalho-icone {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .atalho-icone.azul { background: #dbeafe; }
    .atalho-icone.laranja { background: #ffedd5; }
    .atalho-icone.verde { background: #d1fae5; }

    .atalho-card strong {
      display: block;
      font-size: 0.96rem;
    }

    .atalho-card small {
      color: var(--texto-sec);
      font-size: 0.82rem;
    }

    .atalho-card .seta {
      margin-left: auto;
      color: var(--azul);
      font-weight: 800;
    }

    /* ================= SEÇÕES GERAIS ================= */
    .secao {
      padding: 80px 0;
    }

    .bg-suave {
      background: var(--branco);
      border-top: 1px solid var(--borda);
      border-bottom: 1px solid var(--borda);
    }

    .cabecalho-secao {
      text-align: center;
      max-width: 620px;
      margin: 0 auto 48px;
    }

    .etiqueta {
      display: inline-block;
      color: var(--azul);
      background: var(--azul-suave);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .cabecalho-secao h2 {
      font-size: clamp(1.8rem, 3.2vw, 2.5rem);
      color: var(--azul-escuro);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .cabecalho-secao h2 span {
      color: var(--laranja);
    }

    .cabecalho-secao p {
      color: var(--texto-sec);
    }

    /* ================= SOBRE ASSIMÉTRICO ================= */
    #sobre .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }

    #sobre .cabecalho-secao {
      grid-column: 1 / -1;
    }

    .pilares-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-pilar {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--sombra);
    }

    .icone-pilar {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      margin-bottom: 14px;
    }

    .icone-pilar.laranja { background: #ffedd5; }
    .icone-pilar.verde { background: #d1fae5; }

    .card-pilar h3 {
      font-size: 1.2rem;
      color: var(--azul-escuro);
      margin-bottom: 8px;
    }

    .card-pilar p {
      color: var(--texto-sec);
      font-size: 0.94rem;
      line-height: 1.65;
    }

    .historia-box {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--sombra);
    }

    .historia-box h3 {
      color: var(--azul-escuro);
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-left: 2px solid #cbd5e1;
      padding-left: 18px;
      margin-left: 6px;
    }

    .timeline-item {
      position: relative;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -24px;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--laranja);
    }

    .timeline-item .ano {
      font-weight: 800;
      color: var(--azul);
Use o código com cuidado.
font-size: 0.95rem;
}
.timeline-item p {
font-size: 0.88rem;
color: var(--texto-sec);
}
/* ================= CURSOS (3 COLUNAS) ================= */
.cursos-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 24px;
}
.curso-card {
background: var(--fundo);
padding: 32px;
border-radius: 22px;
border: 1px solid var(--borda);
transition: 0.25s;
}
.curso-card:hover {
border-color: var(--azul);
transform: translateY(-4px);
box-shadow: var(--sombra);
}
.curso-topo {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 18px;
}
.curso-badge {
background: var(--azul-suave);
color: var(--azul);
font-size: 0.75rem;
font-weight: 700;
padding: 5px 12px;
border-radius: 99px;
}
.curso-emoji {
font-size: 1.6rem;
}
.curso-card h3 {
font-size: 1.25rem;
color: var(--azul-escuro);
margin-bottom: 10px;
}
.curso-card p {
font-size: 0.92rem;
color: var(--texto-sec);
line-height: 1.6;
}
/* COLE AQUI O RESTANTE DO SEU CSS (GALERIA, CONTATO, FOOTER E @MEDIA) */
@media (max-width: 900px) {
.hero-grid,
.atalhos-grid,
#sobre .container,
.cursos-grid {
grid-template-columns: 1fr;
}
}

SOBRE A ESCOLA
Nossa história e compromisso.
A educação abre caminhos e ajuda cada estudante a descobrir seu verdadeiro potencial.
🎯
Objetivo da Escola
Oferecer educação de qualidade, proporcionando aos estudantes conhecimentos, habilidades e
competências para continuar os estudos, ingressar no mercado de trabalho e participar da
sociedade de forma responsável, contribuindo para sua formação intelectual, social e cidadã.
🤝
Compromisso da Escola
Promover o ensino e a aprendizagem, incentivando o respeito, a responsabilidade, a
solidariedade e a convivência entre os estudantes. Preparar os alunos para os desafios da
vida, valorizando as diferenças e formando cidadãos conscientes de seus direitos e deveres.
Linha do Tempo Institucional


1958
Criada em 28 de novembro de 1958 como Ginásio Estadual de Cerquilho.
1959
Instalada em 7 de março com o nome de Ginásio Estadual Governador Jânio Quadros.
1963
Recebe o nome de Ginásio Estadual Presidente Arthur da Silva Bernardes.
1970
Transformada oficialmente em Escola Estadual.
1984
Passa a oferecer o tradicional curso de Magistério.
1999
Oficialização da denominação atual: E.E. Presidente Arthur da Silva Bernardes.
FORMAÇÃO PROFISSIONAL
Cursos Disponíveis.
Preparação prática e teórica para conectar nossos estudantes às exigências do mercado de trabalho.
Ensino Técnico
📊

Administração
Desenvolva visão estratégica, liderança, gestão financeira, recursos humanos, empreendedorismo
e organização empresarial para atuar em diversos setores do mercado.
Tecnologia
💻

Desenvolvimento de Sistemas
Aprenda lógica de programação, criação de sites, aplicativos, bancos de dados e soluções
digitais inovadoras com foco na prática e resolução de problemas reais.
Ensino Técnico
🤝

Vendas
Domine técnicas de negociação, atendimento ao cliente, marketing comercial, prospecção e
estratégias de relacionamento para impulsionar resultados no varejo e no meio corporativo.
